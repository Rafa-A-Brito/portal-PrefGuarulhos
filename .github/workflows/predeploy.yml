name: Pre-deploy checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend / API / PostgreSQL isolado
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Nunca usar credenciais ou destino de produção neste job.
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/portal_ci_test
      JWT_SECRET: f84cb00bc332f7231a46dae8af9a9d0c336437550137418621ab0089e239bfd2
      CORS_ORIGIN: http://localhost:5173
      TEST_DATABASE_EXCLUSIVE: '1'
      SECURITY_TEST_DATABASE_EXCLUSIVE: '1'
      TEST_POSTGRES_PORT: '5437'
      TEST_COMPOSE_PROJECT: portal_ci_metricas_${{ github.run_id }}_${{ github.run_attempt }}
      METRICAS_COLETA_ATIVA: 'false'
      METRICAS_CONSULTA_ATIVA: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run lint
      - name: Gerar credenciais efêmeras distintas
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          const nomes = ['TEST_POSTGRES_PASSWORD','TEST_API_PASSWORD','TEST_MIGRATION_PASSWORD','TEST_METRICAS_PASSWORD'];
          const senhas = Object.fromEntries(nomes.map(n => [n, randomBytes(24).toString('hex')]));
          for (const valor of Object.values(senhas)) console.log('::add-mask::' + valor);
          const destino = '127.0.0.1:' + process.env.TEST_POSTGRES_PORT + '/portal_test';
          appendFileSync(process.env.GITHUB_ENV, [
            ...Object.entries(senhas).map(([k,v]) => k + '=' + v),
            'TEST_DATABASE_URL=postgresql://portal_test:' + senhas.TEST_POSTGRES_PASSWORD + '@' + destino,
            'SECURITY_API_DATABASE_URL=postgresql://portal_api:' + senhas.TEST_API_PASSWORD + '@' + destino,
            'SECURITY_MIGRATION_DATABASE_URL=postgresql://portal_migrator:' + senhas.TEST_MIGRATION_PASSWORD + '@' + destino,
            'METRICAS_OPERACAO_URL=postgresql://portal_metricas_operador:' + senhas.TEST_METRICAS_PASSWORD + '@' + destino,
            '',
          ].join('\n'));
          NODE
      - name: Criar somente volume e PostgreSQL de teste novos
        working-directory: .
        run: |
          if docker volume inspect "${TEST_COMPOSE_PROJECT}_pg_test" >/dev/null 2>&1 || docker container inspect "${TEST_COMPOSE_PROJECT}-db_test-1" >/dev/null 2>&1; then
            echo "Volume já existe; nenhuma reconstrução automática permitida."
            exit 1
          fi
          echo "TEST_COMPOSE_CREATED=1" >> "$GITHUB_ENV"
          docker compose -f compose.metricas.test.yml -p "$TEST_COMPOSE_PROJECT" up -d --wait db_test
      - name: Identificar cluster, aplicar migrations pelo migrator e testar V1/V2
        run: node scripts/validar_metricas_test.js
      - name: Validar exemplos systemd sem instalar
        working-directory: .
        run: systemd-analyze verify infra/systemd/portal-metricas-*.service infra/systemd/portal-metricas-*.timer
      - name: Testar Nginx e HTTPS somente em fixtures isoladas
        env:
          PROXY_METRICAS_TEST_EXCLUSIVE: '1'
          TEST_BACKEND_IMAGE: node:24-slim
          TEST_NGINX_IMAGE: nginx:alpine
        run: |
          docker pull node:24-slim
          docker pull nginx:alpine
          node scripts/testar_proxy_metricas.js
      - name: Auditar dependências de produção e desenvolvimento
        run: npm audit --audit-level=high
      - name: Encerrar somente o compose de teste
        if: always() && env.TEST_COMPOSE_CREATED == '1'
        working-directory: .
        run: docker compose -f compose.metricas.test.yml -p "$TEST_COMPOSE_PROJECT" down -v

  frontend:
    name: Frontend / interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - name: Auditar dependências de produção e desenvolvimento
        run: npm audit --audit-level=high
