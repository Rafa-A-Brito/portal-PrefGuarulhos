# Arquivo AUTÔNOMO: nunca combinar com docker-compose.yml.
# Toda inicialização usa portal_test em tmpfs, sem volumes persistentes.
services:
  db_test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portal_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?defina TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: portal_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_test -d portal_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/normal_unavailable
      TEST_DATABASE_URL: postgresql://portal_test:${TEST_POSTGRES_PASSWORD}@db_test:5432/portal_test
      TEST_DATABASE_EXCLUSIVE: "1"
      JWT_SECRET: ${TEST_JWT_SECRET:?defina TEST_JWT_SECRET}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGIN: http://localhost:8091
    command: ["node", "scripts/start-test-server.js"]
    ports:
      - "127.0.0.1:${TEST_BACKEND_PORT:-3334}:3333"
    tmpfs:
      - /app/uploads
    depends_on:
      db_test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:${TEST_FRONTEND_PORT:-8091}:80"
    depends_on:
      backend:
        condition: service_healthy
