# Carregado em http{} pelo nginx.conf da imagem; zonas compartilhadas entre workers.
limit_req_zone $binary_remote_addr zone=metricas_rede:10m rate=10r/s;
limit_req_zone $server_name zone=metricas_total:1m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=metricas_conexoes:10m;
log_format metricas_operacao '$time_iso8601 $status $request_time';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/metricas {
        add_header Cache-Control no-store always;
        return 404;
    }

    location ^~ /api/metricas/ {
        client_max_body_size 2k;
        client_body_timeout 5s;
        limit_req zone=metricas_rede burst=60 nodelay;
        limit_req zone=metricas_total burst=120 nodelay;
        limit_req_status 429;
        limit_req_log_level notice;
        limit_conn metricas_conexoes 20;
        limit_conn_status 429;
        error_page 429 = @metricas_limite;
        access_log /dev/stdout metricas_operacao;
        add_header Cache-Control no-store always;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        proxy_http_version 1.1;
        proxy_pass http://backend:3333;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
    }

    location @metricas_limite {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Cache-Control no-store always;
        return 429 '{"success":false,"error":{"code":"TOO_MANY_REQUESTS","message":"Aguarde antes de enviar novas métricas."}}';
    }

    location ^~ /uploads/ {
        proxy_pass http://backend:3333;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /api/ {
        proxy_pass http://backend:3333;
        client_max_body_size 12m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
