# Cadeia: cliente -> Nginx -> API sem porta publicada.
# Proxy externo opcional: adicionar SOMENTE seu IP/CIDR nas duas linhas comentadas.
# O salto externo deve sobrescrever X-Forwarded-For e X-Forwarded-Proto.
# set_real_ip_from 192.0.2.10/32;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
geo $realip_remote_addr $trusted_edge {
    default 0;
    # 192.0.2.10/32 1;
}
map "$trusted_edge:$http_x_forwarded_proto" $origin_scheme {
    default $scheme;
    "1:https" https;
    "1:http" http;
}
map $request_method $auth_quota_key { default ""; POST $binary_remote_addr; }
limit_req_zone $auth_quota_key zone=auth_login:10m rate=30r/m;
limit_req_zone $auth_quota_key zone=auth_refresh:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_publica:10m rate=30r/s;
log_format api_operacao '$time_iso8601 $status $request_time';

# Carregado em http{} pelo nginx.conf da imagem; zonas compartilhadas entre workers.
limit_req_zone $binary_remote_addr zone=metricas_rede:10m rate=10r/s;
limit_req_zone $server_name zone=metricas_total:1m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=metricas_conexoes:10m;
log_format metricas_operacao '$time_iso8601 $status $request_time';

# Feedback tem quotas e logs próprios, sem URI, IP, conteúdo ou headers.
limit_req_zone $binary_remote_addr zone=feedback_rede:10m rate=5r/m;
limit_req_zone $server_name zone=feedback_total:1m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=feedback_conexoes:10m;
log_format feedback_operacao '$time_iso8601 $status $request_time';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sem URI/query, IP, UA ou headers arbitrarios nos logs.
    access_log /dev/stdout api_operacao;
    error_log /dev/null;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/feedback {
        access_log /dev/stdout feedback_operacao;
        # O error log padrão pode incluir URI/referrer arbitrários.
        error_log /dev/null;
        add_header Cache-Control no-store always;
        if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
        if ($request_uri != /api/feedback) { return 400; }
        client_max_body_size 16k;
        client_body_buffer_size 16k;
        client_body_timeout 5s;
        limit_req zone=feedback_rede burst=4 nodelay;
        limit_req zone=feedback_total burst=10 nodelay;
        limit_req_status 429;
        limit_conn feedback_conexoes 5;
        limit_conn_status 429;
        error_page 429 = @feedback_limite;
        error_page 502 504 = @feedback_indisponivel;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
        proxy_next_upstream off;
        proxy_http_version 1.1;
        proxy_pass http://backend:3333;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        proxy_set_header Forwarded "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }

    location ^~ /api/feedback/ {
        access_log /dev/stdout feedback_operacao;
        error_log /dev/null;
        add_header Cache-Control no-store always;
        return 404;
    }

    location @feedback_limite {
        access_log /dev/stdout feedback_operacao;
        error_log /dev/null;
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control no-store always;
        return 429 '{"success":false,"error":{"code":"TOO_MANY_REQUESTS","message":"Aguarde antes de enviar novo feedback."}}';
    }

    location @feedback_indisponivel {
        access_log /dev/stdout feedback_operacao;
        error_log /dev/null;
        default_type application/json;
        add_header Retry-After 5 always;
        add_header Cache-Control no-store always;
        return 503 '{"success":false,"error":{"code":"FEEDBACK_INDISPONIVEL","message":"Não foi possível confirmar o recebimento."}}';
    }

    location ^~ /api/admin/feedback {
        access_log /dev/stdout feedback_operacao;
        error_log /dev/null;
        add_header Cache-Control "private, no-store" always;
        proxy_pass http://backend:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        proxy_set_header Forwarded "";
    }

    location = /api/metricas {
        add_header Cache-Control no-store always;
        return 404;
    }

    location ^~ /api/metricas/ {
        client_max_body_size 2k;
        client_body_timeout 5s;
        limit_req zone=metricas_rede burst=60 nodelay;
        limit_req zone=metricas_total burst=120 nodelay;
        limit_req_status 429;
        limit_req_log_level notice;
        limit_conn metricas_conexoes 20;
        limit_conn_status 429;
        error_page 429 = @metricas_limite;
        access_log /dev/stdout metricas_operacao;
        add_header Cache-Control no-store always;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        proxy_http_version 1.1;
        proxy_pass http://backend:3333;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        proxy_set_header Forwarded "";
    }

    location @metricas_limite {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Cache-Control no-store always;
        return 429 '{"success":false,"error":{"code":"TOO_MANY_REQUESTS","message":"Aguarde antes de enviar novas métricas."}}';
    }

    location ^~ /uploads/ {
        proxy_pass http://backend:3333;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        proxy_set_header Forwarded "";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* ^/api/auth/login/?$ {
        limit_req zone=auth_login burst=29 nodelay;
        limit_req_status 429;
        error_page 429 = @auth_login_limite;
        client_max_body_size 100k;
        add_header Cache-Control no-store always;
        proxy_pass http://backend:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        proxy_set_header Forwarded "";
    }

    location @auth_login_limite {
        default_type application/json;
        add_header Retry-After 2 always;
        add_header Cache-Control no-store always;
        return 429 '{"success":false,"message":"Muitas tentativas. Aguarde e tente novamente.","error":{"code":"TOO_MANY_REQUESTS","message":"Muitas tentativas. Aguarde e tente novamente."}}';
    }

    location ~* ^/api/auth/refresh/?$ {
        limit_req zone=auth_refresh burst=100 nodelay;
        limit_req_status 429;
        error_page 429 = @auth_refresh_limite;
        client_max_body_size 100k;
        add_header Cache-Control no-store always;
        proxy_pass http://backend:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        proxy_set_header Forwarded "";
    }

    location @auth_refresh_limite {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Cache-Control no-store always;
        return 429 '{"success":false,"message":"Muitas tentativas. Aguarde e tente novamente.","error":{"code":"TOO_MANY_REQUESTS","message":"Muitas tentativas. Aguarde e tente novamente."}}';
    }

    location @api_limite {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Cache-Control no-store always;
        return 429 '{"success":false,"message":"Muitas requisicoes. Aguarde e tente novamente.","error":{"code":"TOO_MANY_REQUESTS","message":"Muitas requisicoes. Aguarde e tente novamente."}}';
    }

    location /api/ {
        limit_req zone=api_publica burst=150 nodelay;
        limit_req_status 429;
        error_page 429 = @api_limite;
        proxy_pass http://backend:3333;
        client_max_body_size 12m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        proxy_set_header Forwarded "";
    }

    location ~* ^(?!/api/).*\.(?:css|js|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
