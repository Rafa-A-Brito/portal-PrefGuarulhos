services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-patrimonio_guarulhos}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?defina API_DB_PASSWORD}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?defina MIGRATION_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: ./backend
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgresql://portal_migrator:${MIGRATION_DB_PASSWORD:?defina MIGRATION_DB_PASSWORD}@db:5432/${POSTGRES_DB:-patrimonio_guarulhos}
    command: ["node", "scripts/migrate-deploy.js"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://portal_api:${API_DB_PASSWORD:?defina API_DB_PASSWORD}@db:5432/${POSTGRES_DB:-patrimonio_guarulhos}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8090}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (mínimo 32 caracteres)}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-900}
      UPLOAD_DIR: /app/uploads
      UPLOAD_ROOT: /app/uploads
      TRUST_PROXY_IPS: 172.30.87.2
      LOGIN_RATE_WINDOW_MS: ${LOGIN_RATE_WINDOW_MS:-900000}
      LOGIN_RATE_IP_MAX: ${LOGIN_RATE_IP_MAX:-100}
      LOGIN_RATE_ACCOUNT_IP_MAX: ${LOGIN_RATE_ACCOUNT_IP_MAX:-10}
    networks:
      default: {}
      proxy:
        ipv4_address: 172.30.87.3
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3333}:3333"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
        VITE_GEOCODING_ATIVO: ${VITE_GEOCODING_ATIVO:-false}
    restart: unless-stopped
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      proxy:
        ipv4_address: 172.30.87.2
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy

  db_test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: portal_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?defina TEST_POSTGRES_PASSWORD para o banco descartável}
      POSTGRES_DB: portal_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_test -d portal_test"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pg_data:
  uploads_data:

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.87.0/29
