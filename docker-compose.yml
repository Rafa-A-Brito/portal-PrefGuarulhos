# PROPOSTA (não testada com Docker). Fica na raiz do repo, no lugar do compose antigo (MySQL).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal}
      POSTGRES_DB: ${POSTGRES_DB:-patrimonio_guarulhos}
    ports:
      - "5433:5432" # 5433 no host, para não colidir com o Postgres instalado na sua máquina (5432)
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-patrimonio_guarulhos}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD:-portal}@db:5432/${POSTGRES_DB:-patrimonio_guarulhos}
      CORS_ORIGIN: http://localhost:8090
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env da raiz (mínimo 32 caracteres)}
      JWT_TTL_SECONDS: 900
      UPLOAD_DIR: /app/uploads # usado quando o upload de imagens existir
    ports:
      - "3333:3333"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GEOCODING_ATIVO: ${VITE_GEOCODING_ATIVO:-false}
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - backend

volumes:
  pg_data:
  uploads_data:
