server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA — qualquer rota que não seja um arquivo real cai no index.html
    # (react-router cuida do resto no cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para o backend dentro da rede do Docker Compose — o browser
    # só fala com http://localhost:8080/api/..., nunca diretamente com o
    # container do backend, então não existe problema de CORS.
    location ^~ /uploads/ {
        proxy_pass http://backend:3333;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
        proxy_pass http://backend:3333;
        client_max_body_size 12m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
